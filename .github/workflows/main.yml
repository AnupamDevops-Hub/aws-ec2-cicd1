name: Node.js CI/CD to AWS EC2

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # change to 'yarn' if you use Yarn

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test --if-present

  deploy:
    name: Deploy to EC2
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Exit immediately if a command exits with a non-zero status
            set -e

            # Navigate to the application directory on EC2
           /home/ec2-user/aws-ec2-cicd1

            # Pull latest changes from GitHub
            git pull origin main

            # Install dependencies (production only)
            npm install --production

            # Build application (uncomment if using TypeScript / Next.js / Vite build step)
            # npm run build --if-present

            # Restart application using PM2
            pm2 restart app-name || pm2 start index.js --name "app-name"
            pm2 save